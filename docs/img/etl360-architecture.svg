<?xml version="1.0" encoding="UTF-8"?>
<!-- Same artwork as frontend/src/components/landing/ArchitectureDiagram.tsx, exported for
     README/GitHub rendering: literal hex colours (no CSS custom properties survive outside the
     app) and no button/role wrappers (a static file has nowhere to navigate). Icon glyphs are
     original hand-drawn shapes suggestive of each technology, not vendor logos. -->
<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;height:auto;display:block;background:#0b0d14">
  <title>ETL 360 architecture: an IPC/XML export becomes JSON recipes and BigQuery DDL through the Scala translation layer, which a Spring-based API serves to the React application's four tabs — Viewer, Modifier, Operational, DAG — with links out to BigQuery, Dataproc and Cloud Logging on GCP.</title>

  <defs>
    <marker id="arch-diagram-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a3050" />
    </marker>
  </defs>

  <!-- connectors -->
  <path d="M250,60 L280,60" stroke="#2a3050" stroke-width="1.4" fill="none" marker-end="url(#arch-diagram-arrow)" />
  <path d="M470,60 L500,60" stroke="#2a3050" stroke-width="1.4" fill="none" marker-end="url(#arch-diagram-arrow)" />
  <path d="M630,100 L630,220 L480,220 L480,248" stroke="#2a3050" stroke-width="1.4" fill="none" marker-end="url(#arch-diagram-arrow)" />
  <path d="M135,214 L135,232 L340,232 L340,248" stroke="#2a3050" stroke-width="1.4" fill="none" marker-end="url(#arch-diagram-arrow)" />
  <path d="M395,214 L410,248" stroke="#2a3050" stroke-width="1.4" fill="none" marker-end="url(#arch-diagram-arrow)" />
  <path d="M655,214 L655,232 L480,232 L480,248" stroke="#2a3050" stroke-width="1.4" fill="none" marker-end="url(#arch-diagram-arrow)" />
  <path d="M410,320 L390,354" stroke="#2a3050" stroke-width="1.4" fill="none" marker-end="url(#arch-diagram-arrow)" />
  <path d="M390,458 L390,492" stroke="#2a3050" stroke-width="1.4" fill="none" marker-end="url(#arch-diagram-arrow)" />

  <!-- row A: IPC Powermart XML -> parser -> recipes/DDL -->
  <g>
    <rect x="20" y="20" width="230" height="80" rx="10" fill="#131621" stroke="#34d399" stroke-width="1.4" />
    <g transform="translate(34,32)" style="color:#34d399">
      <rect x="2" y="4" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.2" fill="none" />
      <line x1="4" y1="4" x2="4" y2="1" stroke="currentColor" stroke-width="1.2" />
      <line x1="6" y1="4" x2="6" y2="1" stroke="currentColor" stroke-width="1.2" />
      <line x1="8" y1="6.5" x2="12" y2="6.5" stroke="currentColor" stroke-width="1.2" />
    </g>
    <g transform="translate(56,32)" style="color:#34d399">
      <path d="M4 3L1 7l3 4M10 3l3 4-3 4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="34" y="64" font-size="12" font-weight="700" fill="#34d399" font-family="Inter, sans-serif">IPC Powermart XML</text>
    <text x="34" y="82" font-size="10" font-weight="500" fill="#7b88aa" font-family="Inter, sans-serif">xmltobq corpus → Viewer</text>
  </g>

  <g>
    <rect x="280" y="20" width="190" height="80" rx="10" fill="#131621" stroke="#2a3050" stroke-width="1.2" />
    <g transform="translate(294,32)" style="color:#7b88aa">
      <path d="M2 6h8v3a4 4 0 01-4 4 4 4 0 01-4-4V6z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round" />
      <path d="M10 7h1a2 2 0 010 4h-1" stroke="currentColor" stroke-width="1.1" fill="none" />
      <path d="M4.5 4c0-1 1-1 1-2M7.5 4c0-1 1-1 1-2" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" />
    </g>
    <text x="294" y="64" font-size="11.5" font-weight="700" fill="#e2e8f8" font-family="Inter, sans-serif">parser/ (Scala 2.12)</text>
    <text x="294" y="82" font-size="10" font-weight="500" fill="#7b88aa" font-family="Inter, sans-serif">XML → JSON + DDL</text>
  </g>

  <g>
    <rect x="500" y="20" width="260" height="80" rx="10" fill="#131621" stroke="#818cf8" stroke-width="1.4" />
    <g transform="translate(514,32)" style="color:#818cf8">
      <path d="M5 2.2c-1.1 0-1.7.6-1.7 1.7v1.6c0 .9-.3 1.2-1.1 1.2.8 0 1.1.3 1.1 1.2v1.6c0 1.1.6 1.7 1.7 1.7" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M9 2.2c1.1 0 1.7.6 1.7 1.7v1.6c0 .9.3 1.2 1.1 1.2-.8 0-1.1.3-1.1 1.2v1.6c0 1.1-.6 1.7-1.7 1.7" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="514" y="64" font-size="12" font-weight="700" fill="#818cf8" font-family="Inter, sans-serif">_ETL_*.json recipes + DDL</text>
    <text x="514" y="82" font-size="10" font-weight="500" fill="#7b88aa" font-family="Inter, sans-serif">BigQuery DDL → Modifier</text>
  </g>

  <!-- row B: the three data roots that feed the backend -->
  <g>
    <rect x="20" y="134" width="230" height="80" rx="10" fill="#131621" stroke="#4f9cf9" stroke-width="1.4" />
    <g transform="translate(34,146)" style="color:#4f9cf9">
      <circle cx="7" cy="7" r="1.2" fill="currentColor" />
      <path d="M7 7C6.6 4.3 5 2.3 2.8 2c.3 2.6 1.9 4.4 4.2 5z" fill="currentColor" opacity="0.85" />
      <path d="M7 7c2.6.2 4.7-1.1 5.4-3.5-2.6-.2-4.7 1.1-5.4 3.5z" fill="currentColor" opacity="0.7" />
      <path d="M7 7c-1 2.5-.6 5 1.4 6.6.9-2.4.5-5-1.4-6.6z" fill="currentColor" opacity="0.55" />
    </g>
    <text x="34" y="178" font-size="12" font-weight="700" fill="#4f9cf9" font-family="Inter, sans-serif">DWH_CONTROL</text>
    <text x="34" y="196" font-size="10" font-weight="500" fill="#7b88aa" font-family="Inter, sans-serif">control schema, workflows → DAG</text>
  </g>

  <g>
    <rect x="280" y="134" width="230" height="80" rx="10" fill="#131621" stroke="#fb923c" stroke-width="1.4" />
    <g transform="translate(294,146)" style="color:#fb923c">
      <line x1="2" y1="4" x2="12" y2="4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
      <line x1="2" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
      <line x1="2" y1="10" x2="9" y2="10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <text x="294" y="178" font-size="12" font-weight="700" fill="#fb923c" font-family="Inter, sans-serif">composer (b15 CSVs)</text>
    <text x="294" y="196" font-size="10" font-weight="500" fill="#7b88aa" font-family="Inter, sans-serif">job history → Operational</text>
  </g>

  <g>
    <rect x="540" y="134" width="230" height="80" rx="10" fill="#131621" stroke="#34d399" stroke-width="1.4" />
    <g transform="translate(554,146)" style="color:#34d399">
      <path d="M4 3L1 7l3 4M10 3l3 4-3 4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="554" y="178" font-size="12" font-weight="700" fill="#34d399" font-family="Inter, sans-serif">xmltobq (corpus)</text>
    <text x="554" y="196" font-size="10" font-weight="500" fill="#7b88aa" font-family="Inter, sans-serif">IPC exports → Viewer</text>
  </g>

  <!-- backend -->
  <g>
    <rect x="270" y="248" width="280" height="72" rx="10" fill="#131621" stroke="#2a3050" stroke-width="1.2" />
    <g transform="translate(286,260)" style="color:#7b88aa">
      <path d="M2.5 11.5c0-5.5 3-8.5 9-8.5-1 5.5-3.5 8.5-9 8.5z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round" />
      <path d="M2.5 11.5c2.2-2.3 4.4-4.5 8.5-8.3" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" />
    </g>
    <text x="286" y="290" font-size="11.5" font-weight="700" fill="#e2e8f8" font-family="Inter, sans-serif">backend/ (Spring Boot 3.3)</text>
    <text x="286" y="308" font-size="10" font-weight="500" fill="#7b88aa" font-family="Inter, sans-serif">calls Scala in-JVM (ADR-0001)</text>
  </g>

  <!-- frontend, one chip per tab, each using that tab's own accent -->
  <g>
    <rect x="180" y="354" width="420" height="104" rx="10" fill="#131621" stroke="#2a3050" stroke-width="1.2" />
    <text x="196" y="378" font-size="11.5" font-weight="700" fill="#e2e8f8" font-family="Inter, sans-serif">frontend/ (React 19 + Vite)</text>

    <rect x="196" y="398" width="92" height="44" rx="7" fill="none" stroke="#34d399" stroke-width="1" />
    <g transform="translate(204,406)" style="color:#34d399">
      <rect x="1" y="1" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.3" />
      <rect x="8" y="1" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.3" />
      <rect x="1" y="8" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.3" />
      <rect x="8" y="8" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.3" />
    </g>
    <text x="222" y="416" font-size="9.5" font-weight="700" fill="#34d399" font-family="Inter, sans-serif">Viewer</text>

    <rect x="296" y="398" width="92" height="44" rx="7" fill="none" stroke="#818cf8" stroke-width="1" />
    <g transform="translate(304,406)" style="color:#818cf8">
      <path d="M2 10.5V12h1.5l6-6L8 4.5l-6 6zM11.7 3.3a1 1 0 000-1.4l-.6-.6a1 1 0 00-1.4 0l-1 1L10.7 4.3l1-1z" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="322" y="416" font-size="9.5" font-weight="700" fill="#818cf8" font-family="Inter, sans-serif">Modifier</text>

    <rect x="396" y="398" width="92" height="44" rx="7" fill="none" stroke="#fb923c" stroke-width="1" />
    <g transform="translate(404,406)" style="color:#fb923c">
      <circle cx="3" cy="7" r="1.8" stroke="currentColor" stroke-width="1.3" />
      <circle cx="11" cy="3" r="1.8" stroke="currentColor" stroke-width="1.3" />
      <circle cx="11" cy="11" r="1.8" stroke="currentColor" stroke-width="1.3" />
      <line x1="4.8" y1="6.3" x2="9.2" y2="3.7" stroke="currentColor" stroke-width="1.2" />
      <line x1="4.8" y1="7.7" x2="9.2" y2="10.3" stroke="currentColor" stroke-width="1.2" />
    </g>
    <text x="422" y="416" font-size="9.5" font-weight="700" fill="#fb923c" font-family="Inter, sans-serif">Operational</text>

    <rect x="496" y="398" width="92" height="44" rx="7" fill="none" stroke="#4f9cf9" stroke-width="1" />
    <g transform="translate(504,406)" style="color:#4f9cf9">
      <path d="M1 7h3M10 7h3M4 7l2-3 2 3-2 3L4 7z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="12" cy="7" r="1.3" fill="currentColor" />
      <circle cx="2" cy="7" r="1.3" fill="currentColor" />
    </g>
    <text x="522" y="416" font-size="9.5" font-weight="700" fill="#4f9cf9" font-family="Inter, sans-serif">DAG</text>
  </g>

  <!-- GCP surfaces -->
  <g>
    <rect x="210" y="492" width="360" height="60" rx="10" fill="#131621" stroke="#2a3050" stroke-width="1.2" />
    <g transform="translate(226,502)" style="color:#7b88aa">
      <path d="M4.2 10.2a2.4 2.4 0 01-.4-4.77A3 3 0 019.9 4.3a2.4 2.4 0 01.5 4.9H4.2z" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linejoin="round" />
    </g>
    <g transform="translate(244,502)" style="color:#7b88aa">
      <path d="M8 1L3 8h3l-1 5 6-7H8l1-5z" fill="currentColor" />
    </g>
    <text x="262" y="514" font-size="10.5" font-weight="700" fill="#e2e8f8" font-family="Inter, sans-serif">GCP: BigQuery · Dataproc · Cloud Logging</text>
  </g>
</svg>
